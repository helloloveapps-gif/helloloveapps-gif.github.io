<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>매울지도 제보</title>
<style>
  :root { --ink: #1d1611; --red: #b6231c; --paper: #f4ecdf; --line: #d9cbb6; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.6 'Pretendard Variable', Pretendard, system-ui, sans-serif; word-break: keep-all; }
  main { max-width: 560px; margin: 0 auto; padding: 22px 16px 60px; }
  h1 { font-size: 22px; margin: 0 0 2px; } .sub { color: #5b4a3d; font-size: 13px; margin: 0 0 16px; }
  .tabs { display: flex; gap: 8px; margin: 0 0 16px; }
  .tabs button { flex: 1; padding: 12px 8px; font: inherit; font-weight: 700; border: 2px solid var(--ink); border-radius: 10px; background: #fff; color: var(--ink); cursor: pointer; }
  .tabs button[aria-selected=true] { background: var(--red); color: #fff; box-shadow: 0 3px 0 var(--ink); }
  form { background: #fff; border: 2px solid var(--ink); border-radius: 12px; padding: 16px; }
  label { display: block; font-weight: 700; font-size: 14px; margin: 14px 0 4px; } label:first-child { margin-top: 0; }
  label small { font-weight: 400; color: #7a6959; }
  input, textarea, select { width: 100%; padding: 12px; font: inherit; border: 1.5px solid var(--line); border-radius: 8px; background: #fffdf9; color: var(--ink); }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--red); border-color: var(--red); }
  textarea { min-height: 76px; resize: vertical; }
  .go { width: 100%; margin-top: 18px; padding: 14px; font: inherit; font-weight: 800; color: #fff; background: var(--red); border: 2px solid var(--ink); border-radius: 10px; box-shadow: 0 4px 0 var(--ink); cursor: pointer; }
  .go:disabled { opacity: .5; }
  .msg { margin: 14px 0 0; padding: 12px; border-radius: 8px; font-size: 14px; display: none; }
  .msg.ok { display: block; background: #e8f3e4; border: 1.5px solid #4c7a3f; } .msg.err { display: block; background: #fbe6e3; border: 1.5px solid var(--red); }
  .hint { font-size: 13px; color: #5b4a3d; margin: 14px 2px 0; }
  .lang { float: right; font-size: 13px; } .lang a { color: var(--red); margin-left: 8px; }
  [hidden] { display: none !important; }
  .picks { margin-top: 6px; border: 1.5px solid var(--line); border-radius: 8px; background: #fffdf9; max-height: 260px; overflow-y: auto; }
  .picks button { display: block; width: 100%; text-align: left; padding: 12px; font: inherit; background: none; border: 0; border-bottom: 1px solid var(--line); color: var(--ink); cursor: pointer; }
  .picks button:last-child { border-bottom: 0; }
  .picks button small { color: #7a6959; margin-left: 6px; }
  .picks .none { padding: 12px; color: #7a6959; font-size: 14px; }
  input.chosen { border-color: #4c7a3f; background: #f2f8ef; }
  .addr { display: flex; gap: 6px; } .addr input { flex: 1; }
  .find, .more { padding: 0 14px; font: inherit; font-weight: 700; font-size: 14px; border: 1.5px solid var(--ink); border-radius: 8px; background: #fff; color: var(--ink); cursor: pointer; white-space: nowrap; }
  .more { margin-top: 6px; padding: 8px 12px; border-style: dashed; }
  #s-area2, #menus input + input { margin-top: 6px; }
  .phint { display: block; margin-top: 4px; font-size: 12px; color: #7a6959; }
  #v-menus input + input, #v-urls input + input { margin-top: 6px; }
  .postcode { margin-top: 6px; height: 420px; border: 1.5px solid var(--line); border-radius: 8px; overflow: hidden; }
</style>
</head>
<body>
<main>
<div class="lang"><a href="?lang=ko" data-l="ko">한국어</a><a href="?lang=en" data-l="en">English</a><a href="?lang=ja" data-l="ja">日本語</a><a href="?lang=zh" data-l="zh">中文</a></div>
<h1 data-t="title"></h1>
<p class="sub" data-t="sub"></p>

<div class="tabs" role="tablist">
  <button type="button" role="tab" id="tab-video" data-t="tabVideo"></button>
  <button type="button" role="tab" id="tab-store" data-t="tabStore"></button>
</div>

<form id="f-video">
  <label for="v-store" data-t="vStore"></label>
  <input id="v-store" type="search" autocomplete="off" required />
  <div id="picks" class="picks" role="listbox" hidden></div>
  <label><span data-t="vMenu"></span> <small data-t="opt"></small></label>
  <div id="v-menus"><input class="v-menu" maxlength="18" /></div>
  <button type="button" id="v-add-menu" class="more" data-t="addMenu"></button>
  <label for="v-level"><span data-t="sLevel"></span> <small data-t="opt"></small></label>
  <select id="v-level"><option value="">—</option></select>
  <label for="v-note"><span data-t="sNote"></span> <small data-t="opt"></small></label>
  <textarea id="v-note" maxlength="300"></textarea>
  <label for="v-url" data-t="vUrl"></label>
  <div id="v-urls"><input id="v-url" class="v-url" type="url" inputmode="url" placeholder="https://youtu.be/…" required /></div>
  <button type="button" id="v-add-url" class="more" data-t="addVideo"></button>
  <button class="go" data-t="send"></button>
  <p class="msg" id="m-video" role="status"></p>
  <p class="hint" data-t="vHint"></p>
</form>

<form id="f-store" hidden>
  <label for="s-name" data-t="sName"></label>
  <input id="s-name" maxlength="60" required />
  <label for="s-area" data-t="sArea"></label>
  <div class="addr"><input id="s-area" maxlength="60" required autocomplete="off" /><button type="button" id="s-find" class="find" data-t="sFind"></button></div>
  <div id="postcode" class="postcode" hidden></div>
  <input id="s-area2" maxlength="20" data-ph="sArea2" />
  <label for="s-menu"><span data-t="sMenu"></span> <small data-t="opt"></small></label>
  <div id="menus"><input class="s-menu" id="s-menu" maxlength="18" /></div>
  <button type="button" id="add-menu" class="more" data-t="addMenu"></button>
  <label for="s-level"><span data-t="sLevel"></span> <small data-t="opt"></small></label>
  <select id="s-level"><option value="">—</option></select>
  <label for="s-link"><span data-t="sLink"></span> <small data-t="opt"></small></label>
  <input id="s-link" type="url" inputmode="url" maxlength="300" />
  <label for="s-photo"><span data-t="sPhoto"></span> <small data-t="opt"></small></label>
  <input id="s-photo" type="file" accept="image/*" multiple />
  <small class="phint" id="s-photo-n" data-t="sPhotoHint"></small>
  <label for="s-note"><span data-t="sNote"></span> <small data-t="opt"></small></label>
  <textarea id="s-note" maxlength="300"></textarea>
  <button class="go" data-t="send"></button>
  <p class="msg" id="m-store" role="status"></p>
  <p class="hint" data-t="sHint"></p>
</form>
</main>

const q = new URLSearchParams(location.search);
const nav = (navigator.language || 'ko').slice(0, 2);
const lang = T[q.get('lang')] ? q.get('lang') : T[nav] ? nav : 'en';
const t = T[lang];
document.documentElement.lang = lang;
document.title = t.title;
for (const e of document.querySelectorAll('[data-t]')) e.textContent = t[e.dataset.t];
for (const a of document.querySelectorAll('.lang a')) { const p = new URLSearchParams(q); p.set('lang', a.dataset.l); a.href = '?' + p; if (a.dataset.l === lang) a.style.fontWeight = '800'; }
const $ = (id) => document.getElementById(id);
for (let i = 1; i <= 10; i++) { $('s-level').append(new Option(t.lv[i - 1], String(i))); $('v-level').append(new Option(t.lv[i - 1], String(i))); }
for (const e of document.querySelectorAll('[data-ph]')) e.placeholder = t[e.dataset.ph];

// 매운 메뉴 여러 개(최대 4개) — 보낼 때 ', ' 로 묶는다
$('add-menu').onclick = () => {
  const box = $('menus');
  if (box.children.length >= 4) return;
  const i = document.createElement('input'); i.className = 's-menu'; i.maxLength = 18; box.append(i); i.focus();
  if (box.children.length >= 4) $('add-menu').hidden = true;
};
// 영상 붙이기: 먹은 메뉴 여러 개(최대 4) · 영상 여러 개(최대 5)
const adder = (btn, box, cls, max, type) => { $(btn).onclick = () => {
  if ($(box).children.length >= max) return;
  const i = document.createElement('input'); i.className = cls; if (type) { i.type = type; i.inputMode = 'url'; i.placeholder = 'https://youtu.be/…'; } else i.maxLength = 18;
  $(box).append(i); i.focus(); if ($(box).children.length >= max) $(btn).hidden = true;
}; };
adder('v-add-menu', 'v-menus', 'v-menu', 4); adder('v-add-url', 'v-urls', 'v-url', 5, 'url');
// 사진: 긴 변 1600px 로 줄이고 jpg 로 다시 만든다(위치 등 EXIF 는 이때 사라진다)
let photos = [];
const shrink = (file) => new Promise((ok, no) => {
  const img = new Image(); const u = URL.createObjectURL(file);
  img.onload = () => { const k = Math.min(1, 1600 / Math.max(img.width, img.height)); const cv = document.createElement('canvas'); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(u); ok(cv.toDataURL('image/jpeg', 0.82).split(',')[1]); };
  img.onerror = () => no(new Error('img')); img.src = u;
});
$('s-photo').onchange = async (e) => {
  try { photos = await Promise.all([...e.target.files].slice(0, 3).map(shrink)); $('s-photo-n').textContent = t.photoN(photos.length); }
  catch { photos = []; $('s-photo-n').textContent = t.ePhoto; }
};
// 정확한 주소 — 카카오(다음) 우편번호 검색으로 도로명 주소를 고른다(직접 써도 된다)
$('s-find').onclick = () => {
  const go = () => {
    const box = $('postcode'); box.hidden = false;
    new daum.Postcode({ oncomplete: (d) => { $('s-area').value = d.roadAddress || d.jibunAddress || d.address; box.hidden = true; $('s-area2').focus(); }, width: '100%', height: '100%' }).embed(box);
  };
  if (window.daum && daum.Postcode) return go();
  const sc = document.createElement('script'); sc.src = 'https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js'; sc.onload = go; document.head.append(sc);
};
const tab = (which) => {
  for (const k of ['video', 'store']) { $('tab-' + k).setAttribute('aria-selected', String(k === which)); $('f-' + k).hidden = k !== which; }
};
$('tab-video').onclick = () => tab('video');
$('tab-store').onclick = () => tab('store');
tab(q.get('tab') === 'store' ? 'store' : 'video');

// 가게 목록(서버가 안 되면 묶여 있는 목록)
const nameOf = (s) => (lang !== 'ko' && s[lang] && s[lang].name) || (lang !== 'ko' && s.nameEn) || s.name;
const label = (s) => `${nameOf(s)} · ${s.area}`;
let all = [], chosen = null;
// 휴대폰에서 고르기 쉽게: 글자를 넣으면 아래에 맞는 가게가 걸러져 뜨고, 눌러서 고른다(이름·영문 이름·동네·메뉴로 찾음, 띄어쓰기 무시)
const norm = (x) => String(x || '').toLowerCase().replace(/\s+/g, '');
const hay = (s) => norm([s.name, s.nameEn, s.area, s.menu, s.en && s.en.name, s.ja && s.ja.name, s.zh && s.zh.name, s.en && s.en.area].join(' '));
const choose = (s) => { chosen = s; $('v-store').value = label(s); $('v-store').classList.add('chosen'); $('picks').hidden = true; };
const showPicks = () => {
  const q = norm($('v-store').value);
  chosen = null; $('v-store').classList.remove('chosen');
  const box = $('picks'); box.innerHTML = '';
  if (!q) { box.hidden = true; return; }
  const hit = all.filter((s) => hay(s).includes(q)).slice(0, 30);
  if (!hit.length) { const d = document.createElement('div'); d.className = 'none'; d.textContent = t.vNone; box.append(d); }
  for (const s of hit) {
    const b = document.createElement('button'); b.type = 'button'; b.setAttribute('role', 'option');
    b.append(nameOf(s)); const sm = document.createElement('small'); sm.textContent = s.area; b.append(sm);
    b.onclick = () => choose(s); box.append(b);
  }
  box.hidden = false;
};
$('v-store').placeholder = t.vFind;
$('v-store').addEventListener('input', showPicks);
$('v-store').addEventListener('focus', () => { if (!chosen && $('v-store').value) showPicks(); });
(async () => {
  let stores = [];
  try { stores = (await (await fetch(API + '/pack')).json()).stores; } catch { try { stores = (await (await fetch('stores.json')).json()).stores; } catch { /* 목록 없이도 가게 제보는 된다 */ } }
  all = stores;
  const pre = stores.find((s) => s.id === Number(q.get('s')));
  if (pre) choose(pre);
})();

const say = (el, kind, text) => { el.className = 'msg ' + kind; el.textContent = text; };
const send = async (form, msg, path, body, okText) => {
  const btn = form.querySelector('.go');
  btn.disabled = true;
  try {
    const r = await fetch(API + path, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
    if (r.ok) { say(msg, 'ok', okText(r.status === 204 ? {} : await r.json())); return true; }
    const e = r.status === 429 ? 'eBusy' : { url: 'eUrl', video: 'eVideo', store: 'eStore', name: 'eName', area: 'eName', photo: 'ePhoto' }[(await r.json().catch(() => ({}))).error] || 'eNet';
    say(msg, 'err', t[e]);
  } catch { say(msg, 'err', t.eNet); } finally { btn.disabled = false; }
  return false;
};
$('f-video').onsubmit = async (ev) => {
  ev.preventDefault();
  const storeNo = chosen && chosen.id;
  if (!storeNo) return say($('m-video'), 'err', t.eStore);
  const urls = [...document.querySelectorAll('.v-url')].map((i) => i.value.trim()).filter(Boolean);
  const menu = [...document.querySelectorAll('.v-menu')].map((i) => i.value.trim()).filter(Boolean).join(', ').slice(0, 80) || null;
  const extra = { menu, level: $('v-level').value ? Number($('v-level').value) : null, note: $('v-note').value.trim() || null };
  if (urls.length === 1) {
    if (await send($('f-video'), $('m-video'), '/videos/suggest', { storeNo, url: urls[0], ...extra }, (r) => (r.status === 'approved' ? t.okDone : t.okVideo(r)))) $('v-url').value = '';
    return;
  }
  const btn = $('f-video').querySelector('.go'); btn.disabled = true; let ok = 0, bad = 0;
  for (const url of urls) { try { const r = await fetch(API + '/videos/suggest', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ storeNo, url, ...extra }) }); r.ok ? ok++ : bad++; } catch { bad++; } }
  btn.disabled = false; say($('m-video'), ok ? 'ok' : 'err', ok ? t.okVideos(ok, bad) : t.eUrl);
  if (ok) for (const i of document.querySelectorAll('.v-url')) i.value = '';
};
$('f-store').onsubmit = async (ev) => {
  ev.preventDefault();
  const v = (id) => $(id).value.trim() || null;
  const area = [v('s-area'), v('s-area2')].filter(Boolean).join(' ').slice(0, 80) || null;
  const menu = [...document.querySelectorAll('.s-menu')].map((i) => i.value.trim()).filter(Boolean).join(', ').slice(0, 80) || null;
  if (await send($('f-store'), $('m-store'), '/stores/suggest', { name: v('s-name'), area, menu, level: v('s-level') ? Number(v('s-level')) : null, link: v('s-link'), note: v('s-note'), lang, photos }, () => t.okStore)) { $('f-store').reset(); photos = []; $('s-photo-n').textContent = t.sPhotoHint; }
};
</script>
</body>
