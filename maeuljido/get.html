<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>매울지도 설치</title>
<meta property="og:title" content="매울지도 — 매운맛 자격증 도전" />
<meta property="og:description" content="전국 매운 맛집 맵기 지도. 설문 8문항으로 내 매운맛 자격증을 발급받아 보세요." />
<meta property="og:image" content="https://helloloveapps-gif.github.io/maeuljido/icon-512.png" />
<meta name="robots" content="noindex" />
<style>
  body { margin: 0; background: #fbf3e6; color: #3b2a1e; font: 16px/1.5 system-ui, sans-serif; display: grid; place-items: center; min-height: 100vh; text-align: center; padding: 0 16px; }
  img { width: 96px; height: 96px; border-radius: 22px; }
  a { display: inline-block; margin-top: 16px; padding: 14px 28px; border-radius: 12px; background: #d6301e; color: #fff; font-weight: 700; text-decoration: none; }
</style>
</head>
<body>
<main>
  <img src="./icon-192.png" alt="" />
  <h1 id="t">매울지도</h1>
  <p id="d">플레이 스토어로 이동하는 중…</p>
  <a id="go" href="https://play.google.com/store/apps/details?id=com.loveapps.maeuljido">플레이 스토어에서 설치</a>
</main>
<script>
// 자격증 공유 링크: 누르면 안드로이드는 플레이 스토어 앱을 바로 연다(카카오톡 등 앱 안 브라우저 포함). 그 밖은 플레이 웹 페이지로
const PKG = 'com.loveapps.maeuljido';
const WEB = 'https://play.google.com/store/apps/details?id=' + PKG;
const T = { en: ['Opening Google Play…', 'Install on Google Play'], ja: ['Google Play を開いています…', 'Google Play でインストール'], zh: ['正在打开 Google Play…', '在 Google Play 安装'] };
const l = (navigator.language || 'ko').slice(0, 2);
if (T[l]) { document.documentElement.lang = l; document.getElementById('t').textContent = 'Maeul Map'; document.getElementById('d').textContent = T[l][0]; document.getElementById('go').textContent = T[l][1]; }
const ua = navigator.userAgent;
if (/Android/i.test(ua)) {
  const intent = 'intent://details?id=' + PKG + '#Intent;scheme=market;package=com.android.vending;S.browser_fallback_url=' + encodeURIComponent(WEB) + ';end';
  document.getElementById('go').href = intent;
  location.href = intent;
} else {
  location.replace(WEB);
}
</script>
</body>
</html>
