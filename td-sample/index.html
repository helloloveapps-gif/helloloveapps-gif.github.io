const cxy=(c,r)=>({x:GX+(c+0.5)*CS,y:GY+(r+0.5)*CS});
function mkPath(def){const pts=def.map(([c,r])=>cxy(c,r));const cum=[0];for(let i=1;i<pts.length;i++)cum.push(cum[i-1]+Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y));return{pts,cum,len:cum[cum.length-1]};}
const PATH={A:mkPath(PATHDEF.A),B:mkPath(PATHDEF.B)},FLY={A:mkPath(FLYDEF.A),B:mkPath(FLYDEF.B)};
function posAt(p,d){if(d<=0)return{x:p.pts[0].x,y:p.pts[0].y};for(let i=1;i<p.pts.length;i++){if(d<=p.cum[i]){const k=(d-p.cum[i-1])/(p.cum[i]-p.cum[i-1]);return{x:p.pts[i-1].x+(p.pts[i].x-p.pts[i-1].x)*k,y:p.pts[i-1].y+(p.pts[i].y-p.pts[i-1].y)*k};}}const l=p.pts[p.pts.length-1];return{x:l.x,y:l.y};}
const PCELL={};
